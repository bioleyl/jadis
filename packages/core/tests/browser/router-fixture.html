<!doctype html>
<html lang="en">
  <body>
    <div id="router-app"></div>
    <script type="module">
      import { defineRouteGroup, defineRoutes, Jadis, Router } from '/packages/core/dist/esm/index.mjs';

      class BrowserBase extends Jadis {
        static selector = 'browser-base';

        templateHtml() {
          const output = document.createElement('output');
          output.textContent = 'base';
          return output;
        }
      }

      class BrowserHome extends Jadis {
        static selector = 'browser-home';

        templateHtml() {
          const output = document.createElement('output');
          output.textContent = 'home';
          return output;
        }
      }

      class BrowserDetails extends Jadis {
        static selector = 'browser-details';

        templateHtml() {
          const output = document.createElement('output');
          output.textContent = `details:${this.getAttribute('id')}`;
          return output;
        }
      }

      /** A page with changes not saved: it lets the person go, refuses, or asks and answers later. */
      class BrowserEditor extends Jadis {
        static selector = 'browser-editor';

        templateHtml() {
          const output = document.createElement('output');
          output.textContent = 'editor';
          return output;
        }

        canLeave() {
          const answer = window.__leaveAnswer ?? true;
          if (answer !== 'later') {
            return answer;
          }
          return new Promise((resolve) => {
            window.__answerLeave = resolve;
          });
        }
      }

      class BrowserRoot extends Jadis {
        static selector = 'browser-root';

        templateHtml() {
          return document.createElement('slot');
        }
      }

      BrowserBase.register();
      BrowserHome.register();
      BrowserDetails.register();
      BrowserRoot.register();
      BrowserEditor.register();

      const routes = defineRoutes({
        base: { page: BrowserBase, path: '/' },
        home: { page: BrowserHome, path: '/home' },
        details: { page: BrowserDetails, path: '/details/:id' },
        editor: { page: BrowserEditor, path: '/editor' },
        group: defineRouteGroup(
          '/group',
          { home: { page: BrowserHome, path: '/home' } },
          { rootComponentSelector: 'browser-root' }
        ),
      });

      window.startRouter = (mode) => {
        window.history.replaceState({}, '', '/');
        const router = new Router(routes, { mode });
        router.mountOn(document.querySelector('#router-app'));
        window.__jadisRouter = router;
      };
      window.__jadisRouterReady = true;
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <body>
    <browser-parent></browser-parent>
    <browser-bus-receiver></browser-bus-receiver>
    <browser-bus-emitter></browser-bus-emitter>
    <script type="module">
      import { Bus, Jadis, jsx } from '/packages/core/dist/esm/index.mjs';

      const messageBus = new Bus({ message: String });

      class BrowserChild extends Jadis {
        static selector = 'browser-child';

        events = this.useEvents({ message: String });

        templateHtml() {
          return jsx('button', { attrs: { id: 'send', type: 'button' } }, 'Send message');
        }

        onConnect() {
          this.on(this.getElement('#send'), 'click', () => {
            this.events.emit('message', 'Hello from the child');
          });
        }
      }

      class BrowserParent extends Jadis {
        static selector = 'browser-parent';

        refs = this.useRefs((ref) => ({
          child: ref('browser-child'),
          message: ref('#message'),
        }));

        templateHtml() {
          return jsx('div', {}, [
            jsx('browser-child'),
            jsx('output', { attrs: { id: 'message' } }),
          ]);
        }

        onConnect() {
          this.refs.child.events.register('message', (value) => {
            this.refs.message.textContent = value;
          });
        }
      }

      class BrowserBusReceiver extends Jadis {
        static selector = 'browser-bus-receiver';

        refs = this.useRefs((ref) => ({ message: ref('#message') }));

        templateHtml() {
          return jsx('output', { attrs: { id: 'message' } });
        }

        onConnect() {
          this.onBus(messageBus, 'message', (value) => {
            this.refs.message.textContent = value;
            window.__busMessages.push(value);
          });
        }
      }

      class BrowserBusEmitter extends Jadis {
        static selector = 'browser-bus-emitter';

        templateHtml() {
          return jsx('button', { attrs: { id: 'send', type: 'button' } }, 'Send bus message');
        }

        onConnect() {
          this.on(this.getElement('#send'), 'click', () => {
            messageBus.emit('message', 'Hello from the bus');
          });
        }
      }

      // Tabs whose own event is named as a field's native one, with a field slotted into them.
      class BrowserTabs extends Jadis {
        static selector = 'browser-tabs';

        events = this.useEvents({ change: String });

        templateHtml() {
          return jsx('div', {}, [
            jsx('button', { attrs: { id: 'second', type: 'button' } }, 'Second'),
            jsx('button', { attrs: { id: 'locked', type: 'button' } }, 'Locked'),
            jsx('output', { attrs: { id: 'current' } }, 'first'),
            jsx('slot'),
          ]);
        }

        onConnect() {
          for (const name of ['second', 'locked']) {
            this.on(this.getElement(`#${name}`), 'click', () => this.open(name));
          }
        }

        // Asks first: a listener that cancels the event keeps the tab where it is.
        open(name) {
          if (this.events.emit('change', name)) {
            this.getElement('#current').textContent = name;
          }
        }
      }

      BrowserChild.register();
      BrowserParent.register();
      BrowserBusReceiver.register();
      BrowserBusEmitter.register();
      BrowserTabs.register();
      window.__busMessages = [];
      window.__tabChanges = [];
      window.__contextButtons = [];
      document.body.append(
        jsx(
          BrowserTabs,
          {
            onChange: (name, event) => {
              window.__tabChanges.push(name);
              if (name === 'locked') {
                event.preventDefault();
              }
            },
            oncontextmenu: (event) => {
              window.__contextButtons.push(event.button);
              event.preventDefault();
            },
          },
          jsx('select', { attrs: { id: 'slotted' } }, [jsx('option', {}, 'one'), jsx('option', {}, 'two')])
        )
      );
      window.__communicationReady = true;
    </script>
  </body>
</html>
